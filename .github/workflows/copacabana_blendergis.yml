name: Copacabana BlenderGIS georeference
on:
  push:
    branches:
      - codex/copacabana-osm-real-20261008
    paths:
      - 'Scripts/BlenderGIS/copacabana_georef.py'
      - '.github/workflows/copacabana_blendergis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  georeference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout REAL OSM source and OBJ
        uses: actions/checkout@v4
        with:
          ref: codex/copacabana-osm-real-20261008
      - name: Install Blender and required OpenGL libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender libegl1 libgl1 libgl1-mesa-dri libxrender1 libxext6 libxi6 python3-numpy python3-pil python3-pyproj
          blender --version
          blender --background --factory-startup --python-expr "import sys; print('BLENDERPY',sys.version,sys.path); import numpy; print('NUMPY', numpy.__version__)"
      - name: Clone original official BlenderGIS (no third party binary committed)
        run: |
          git clone --depth 1 https://github.com/domlysz/BlenderGIS.git /tmp/BlenderGIS
          test -s /tmp/BlenderGIS/geoscene.py
      - name: Compute geographic georeference using BlenderGIS GeoScene
        run: |
          blender --background --factory-startup --python Scripts/BlenderGIS/copacabana_georef.py
          test -s Tools/Copacabana/data/Copacabana_BlenderGIS_UTM23S.blend
      - name: Save editable georeferenced project
        uses: actions/upload-artifact@v4
        with:
          name: copacabana-real-blendergis-utm23s
          path: Tools/Copacabana/data/Copacabana_BlenderGIS_UTM23S.blend
          retention-days: 30
      - name: Preserve georeferenced BlenderGIS scene in isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Tools/Copacabana/data/Copacabana_BlenderGIS_UTM23S.blend
          if git diff --cached --quiet; then
            echo "No changes to georeferenced blend"
          else
            git commit -m "GIS: archive georeferenced Copacabana BlenderGIS scene"
            git push origin HEAD:codex/copacabana-osm-real-20261008
          fi
