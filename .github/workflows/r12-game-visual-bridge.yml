name: Resort R12 - cross-repo visual bridge contract

on:
  push:
    branches:
      - codex/r12-gameplay-visual-bridge
    paths:
      - 'Tools/Bridge/**'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GAME_BRIDGE_*.json'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GAME_BRIDGE_*.md'
      - '.github/workflows/r12-game-visual-bridge.yml'
      - 'FacilityOps/Assets/_Game/Editor/ResortR12GameBridgeAudit.cs'
      - 'FacilityOps/Assets/_Game/Scripts/Resort/Site/R12GameplayWorldGate.cs'
      - 'FacilityOps/Assets/_Game/Scripts/Resort/Editor/ResortR12GameplayAnchorAudit.cs'
      - 'FacilityOps/Assets/_Game/Resources/Resort/R12GameplayAnchorInventory.json'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GAMEPLAY_ANCHOR*'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GEO_ANCHOR*'
  pull_request:
    paths:
      - 'Tools/Bridge/**'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GAME_BRIDGE_*.json'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GAME_BRIDGE_*.md'
      - '.github/workflows/r12-game-visual-bridge.yml'
      - 'FacilityOps/Assets/_Game/Editor/ResortR12GameBridgeAudit.cs'
      - 'FacilityOps/Assets/_Game/Scripts/Resort/Site/R12GameplayWorldGate.cs'
      - 'FacilityOps/Assets/_Game/Scripts/Resort/Editor/ResortR12GameplayAnchorAudit.cs'
      - 'FacilityOps/Assets/_Game/Resources/Resort/R12GameplayAnchorInventory.json'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GAMEPLAY_ANCHOR*'
      - 'Docs/PROJECT_RESORT_EXECUTION/R12_GEO_ANCHOR*'
  workflow_dispatch:

jobs:
  bridge-contract:
    name: Python source GUID and game safety contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test that the importer is safe to rerun and rejects GUID conflicts
        run: |
          python3 -m unittest discover -s Tools/Bridge -p 'test_*.py' -v
          python3 -m py_compile Tools/Bridge/*.py
          python3 Tools/Bridge/build_r12_anchor_inventory.py --check
      - name: Audit the 622 asset manifest and separate native Unity provenance
        run: |
          python3 Tools/Bridge/check_r12_bridge_contract.py
          python3 -m unittest discover -s Tools/Bridge -p 'test_r12_native_anchor_qa.py' -v
      - name: Read-only checkout of frozen Copacabana OSM and GIS frame
        uses: actions/checkout@v4
        with:
          repository: sergiomrge-tech/Resort-Simulator-
          ref: 5217a65751a334f8ea3934ae1e7f0c75f7594a9c
          path: frozen-visual
          sparse-checkout: |
            geo/data/copacabana.osm.gz
            geo/procedural/R4_SOURCE_FRAME.json
            geo/procedural/R4_OSM_50_STYLE_ASSIGNMENTS.json
            Tools/geo/generate_r6_vegetation.py
          sparse-checkout-cone-mode: false
      - name: Recompute conservative gameplay-lot feasibility against exact OSM snapshot
        run: |
          python3 Tools/Bridge/analyze_r12_geo_anchor_feasibility.py --visual frozen-visual --check
          python3 Tools/Bridge/audit_r12_access_and_p5_options.py --visual frozen-visual --check
          python3 Tools/Bridge/prepare_r12_unity_review_markers.py --check
          echo "R12_OSM_ANCHOR_CANDIDATES_SOURCE_MATCH_PASS (migration disabled)"
      - name: Assert no staged R12 binaries or Unity cache slipped into Git
        run: |
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          assert not any(p.startswith('FacilityOps/Assets/_Game/Preview/') for p in paths)
          assert not any('/Library/' in p or p.startswith('FacilityOps/Library/') for p in paths)
          print('R12_GAME_BRIDGE_NO_BINARIES_IN_PUBLIC_GIT_PASS')
          PY
