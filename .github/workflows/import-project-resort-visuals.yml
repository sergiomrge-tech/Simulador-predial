name: Import Project Resort Visual References

on:
  push:
    branches:
      - claude/w1-masterplan
    paths:
      - .github/workflows/import-project-resort-visuals.yml

permissions:
  contents: write

jobs:
  import-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: claude/w1-masterplan
          fetch-depth: 0

      - name: Download official visual references
        shell: bash
        run: |
          set -euo pipefail
          DIR="Docs/VISUAL_REFERENCES/PROJECT_RESORT_STARTER_PACK"
          mkdir -p "$DIR"

          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/defd4bbf5a7b1cf363ea6dd65d176d0f1e72e4bf6c5fbcd3f5ba5026d47f5990.png" -o "$DIR/01_PRAIA_SANTA_AURORA_QUIOSQUE_INICIAL.png"
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/fc47013fc11e220967ec323f01622c4c491aea34c97a4f629024d5a32110e478.png" -o "$DIR/02_QUIOSQUE_OPERACAO_BALCAO.png"
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/d422ecb9de4596a00df13297593d8bb8174933c37514effb2c2efd21d0067422.png" -o "$DIR/03_QUIOSQUE_ESTOQUE_REPOSICAO.png"
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/9c19b9e9f84ecffd63280a0ca8c17f77798fac9f6a442d1526c9b3cdb7bbecf5.png" -o "$DIR/04_CASA_INICIAL_JOGADOR.png"
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/0871f320db5ee415a37197512b19dbd25abeed4f7134d7fbcea2833b0e678277.png" -o "$DIR/05_PRIMEIRA_POUSADA.png"
          curl -L --fail --retry 3 "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/3dd104dea3b23a4bb4bf7f2626adc83f03a601c696299c0c9678f394a8a96457.png" -o "$DIR/06_RESORT_CINCO_ESTRELAS_NORTH_STAR.png"

          test "$(find "$DIR" -maxdepth 1 -name '*.png' | wc -l)" -eq 6
          file "$DIR"/*.png
          sha256sum "$DIR"/*.png > "$DIR/SHA256SUMS.txt"

      - name: Commit imported images and retire one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Docs/VISUAL_REFERENCES/PROJECT_RESORT_STARTER_PACK
          git rm .github/workflows/import-project-resort-visuals.yml

          if git diff --cached --quiet; then
            echo "No visual reference changes to commit."
            exit 0
          fi

          git commit -m "Add Project Resort official visual starter pack"
          git pull --rebase origin claude/w1-masterplan
          git push origin HEAD:claude/w1-masterplan
